services:
  upload-blob:
    build:
      context: ./apps/upload-blob
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    # Cloudflare Workers (via wrangler/pywrangler) don't inherit ambient
    # container env vars into the Worker's `env` bindings — they only read
    # wrangler.jsonc `vars`, `.dev.vars`, or an auto-loaded `.env` in the
    # project directory. So this app's credentials must be a real file at
    # runtime, not env_file (which just sets container-level OS env vars).
    volumes:
      - ./apps/upload-blob/.env:/app/.env:ro
    networks:
      - njmtech-network
    restart: always

  media:
    build:
      context: .
      dockerfile: apps/media/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/media/.env.development.local
      - environments/media.env
    networks:
      - njmtech-network
    restart: always
    depends_on:
      - upload-blob

  yt-transcribe:
    build:
      context: ./apps/yt-transcribe
      dockerfile: Dockerfile
    env_file:
      - apps/yt-transcribe/.env
      - environments/yt-transcribe.env
    networks:
      - njmtech-network
    restart: always
    depends_on:
      - upload-blob

  blob-cron:
    build:
      context: ./apps/blob-cron
      dockerfile: Dockerfile
    volumes:
      - ./apps/blob-cron/src:/app/src
      - ./apps/blob-cron/main.py:/app/main.py
    env_file:
      - apps/blob-cron/.env
      - environments/blob-cron.env
    networks:
      - njmtech-network
    restart: always

networks:
  njmtech-network:
    driver: bridge
